<html lang="es">
<head>

        body {
            font-family: sans-serif;
            margin: 0;
        }
        header {
            background-color: #4CAF50;

            padding: 20px;

        /* Contenedor Flexbox sencillo */
        .seccion-principal {
            display: flex;
        }
        aside {

        main {

            padding: 15px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
